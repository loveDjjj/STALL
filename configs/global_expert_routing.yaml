# 固定4个时序专家；同簇CDF和连续精度组合分别验证，不叠加。
protocol: global_expert_population_precision_v1
# 首轮Global模型与原始查询，只读。
source_directory: results/runs/global_experts
# 已验收A/B及均值/协方差对照，只读。
controls_directory: results/runs/global_expert_controls
# 本轮独立产物目录，不覆盖既有结果。
run_directory: results/runs/global_expert_routing
# 保持首轮统计查询批量；尾部仅补计算，不增加观察。
query_batch: 4
# 仅使用fit real：第一、第二中心余弦相似度差的中位数。
temperature_rule: median_fit_top_two_gap
# 中位数退化为零时的数值下限，不按性能选择。
temperature_floor: 0.000001
# 同簇参考不足时显式停止，不悄悄回退；本轮实际均超过350。
min_cdf_sources: 128
# 源组配对Poisson重抽样，固定参考与路由条件。
bootstrap_iterations: 1000
bootstrap_seed: 17
# 仅影响CPU并发，不改变统计定义。
analysis_workers: 5
