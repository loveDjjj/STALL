# Historical K=3 MW2 dataset-specific tuned reference. Its calibration samples are disjoint,
# but region/aggregation were selected per target dataset using fake AUC/AP.

config_identity:
  protocol_id: strict20_dataset_specific_k3_v1
  lifecycle: historical_frozen
  current_authority: false

method:
  name: Alpha-STALLED-K3-MW2
  selection_role: historical_dataset_specific_tuned_supplement
  sample_calibration_leakage: false
  fake_label_hyperparameter_selection: true
  universal_main_config: configs/alpha_stalled_clean_universal.yaml
  score_direction: higher_is_real
  global_window_score: G_k = 0.5 * global_spatial + 0.5 * global_T1
  local_window_score: L_k = 0.1 * patch_spatial + 0.9 * same_grid_patch_D2
  video_score: S = 0.6 * recalibrated_mean_G + 0.4 * recalibrated_mean_L

sampling:
  mode: K3_uniform
  requested_windows: 3
  window_seconds: 2
  frames_per_window: 16
  nominal_fps: 8
  short_window_fallback: false
  duplicate_frames: false
  deduplicate_identical_windows: true
  explicit_exclusions: configs/multi_window_exclusions.csv

local_branch:
  beta: 0.10
  temporal_feature: same_grid_second_order
  temporal_feature_version: l2_normalized_delta_v1
  params_by_dataset:
    comgenvid:
      patch_region_size: 3
      aggregation: bottomk_mean
      bottomk_ratio: 0.20
    videofeedback:
      patch_region_size: 1
      aggregation: mean
    genvideo:
      patch_region_size: 2
      aggregation: mean

calibration:
  real_videos_per_dataset: 200
  disjoint_from_evaluation_real: true
  video_weighting: equal
  effective_k_matched: true
  generated_video_use: forbidden

evaluation:
  intersection_by_dataset:
    comgenvid: 4298
    videofeedback: 3500
    genvideo: 13623
  total_videos: 21421
  metrics: [ROC-AUC, AP]
  protocol: pairwise_balanced_by_generator
  bootstrap_iterations: 1000
  historical_tuned_macro_auc: 0.8694
  historical_tuned_macro_ap: 0.8697

evidence:
  report: reports/multi_window_joint_typicality.md
  local_audit: reports/local_residual_multiscale_audit.md
  unified_scale_layer_audit: reports/unified_multiscale_intermediate_layer_audit.md
  unified_scale_layer_report: reports/unified_multiscale_intermediate_layers.md
  clean_universal_report: reports/clean_universal_cross_layer_final.md
  local_results: results/multi_window_joint_typicality
