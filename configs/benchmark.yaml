# 当前活跃 Alpha STALL 实验唯一可编辑的基础配置。
# 所有 run_*.sh 只通过 --set 覆盖与实验直接相关的字段，绝不原地修改本文件。

# 方法默认定义：默认运行消融确认后的 Global+Local D2-only + K=3 方法。
method:
  # 当前仓库只维护这一种方法后端。
  name: alpha_stall
  global:
    # 是否使用严格继承官方 STALL 的 Global Spatial 与 Global T1 证据。
    enabled: true
    # Global 固定加载官方发布的独立 VATEX 白化与 CDF 参数，不得用目标数据集重拟合。
    parameter_source: official_vatex
    parameters: precomputed/stall_params_vatex_dino_v3.npz
    # 官方参数文件的内容校验值，防止误用自建或历史实验参数。
    parameters_sha256: beede546ca4385242c2a26075b8087ab51bee709549fc4ddc79d0eef5acce240
    # Global Spatial 与 Global T1 的融合权重；两者之和应为 1。
    spatial_weight: 0.5
    temporal_weight: 0.5
  local:
    # 是否启用 Local 证据分支；Global-only 消融会关闭此项。
    enabled: true
    # 最终方法用当前 real-only calibration 重拟合；locked_u0 仅供历史 U0 对照。
    parameter_source: fit_real_only
    # 锁定 Local 参数与 K=3 帧索引。不使用已废弃的 release/ 目录。
    locked_parameters_dir: precomputed/locked_u0/local
    locked_frame_indices: data/protocols/locked_u0/frame_indices.json
    # Local 仅由目标域互斥真实校准视频拟合；默认经验协方差与锁定方案一致。
    covariance_estimator: empirical
    # Spatial factorial 显示该分支稳定降低最终 Macro 指标，因此正式方法关闭它。
    spatial_enabled: false
    # 是否使用局部时序动态；关闭后 Local 只保留空间证据。
    temporal_enabled: true
    # 局部时序差分阶数：1 是 D1 消融，2 是默认 D2 方法。
    temporal_order: 2
    # Local 动力学表示。finite_difference 使用上面的 temporal_order；其余值仅供 Stage 2。
    # 可选 curvature、speed_ratio、path_chord、d2_curvature、geometry。
    dynamics: finite_difference
    # Patch 时间对应。默认 same_grid 严格复现当前论文；Stage 1 只覆盖本段字段。
    correspondence:
      # 可选 same_grid、hard_local、soft_local。
      type: same_grid
      # hard/soft 在下一帧的局部搜索半径：1 对应 3×3，2 对应 5×5。
      radius: 1
      # softmax 温度；0.07 是 Stage 1 预注册开发值，不按 fake 结果逐数据集调整。
      temperature: 0.07
      # 余弦相似度中的归一化网格距离惩罚；0.05 为统一开发值。
      spatial_penalty: 0.05
      # none 不加权；aggregation 使用 soft matching 熵置信度加权窗口 likelihood。
      confidence: none
    # 条件真实动力学。默认关闭；Stage 3 只允许 real-quantile speed bins。
    conditional:
      enabled: false
      # 每个 D2/geometry 位置以后一条一阶速度的 L2 范数作为当前运动状态。
      state: current_speed
      # slow/medium/fast 三个等频真实运动区间，仅由 calibration real 确定边界。
      bins: 3
      binning: real_quantile
    # 最终 Local 只保留 D2；历史 Spatial+D2 变体在脚本中显式覆盖为 0.1/0.9。
    spatial_weight: 0.0
    temporal_weight: 1.0
  fusion:
    # 视频级 Global 与 Local 的最终融合权重；两者之和应为 1。
    global_weight: 0.6
    local_weight: 0.4

# 统一采样协议。M03 只允许覆盖 num_windows，其他主实验保持默认值。
sampling:
  # 每个时间窗口覆盖的视频长度，单位为秒。
  window_seconds: 2
  # 每秒采样帧数；与 window_seconds 共同决定每窗口帧数。
  fps: 8
  # 每个窗口使用的互异帧数量。
  frames_per_window: 16
  # 每个视频的均匀时间窗口数；默认 K=3，M03 K=1 消融会覆盖为 1。
  num_windows: 3
  # 窗口在整段视频中的确定性分布策略。
  strategy: uniform

# 只使用目标域真实视频建立统计参数与经验 CDF，不使用评测集真实视频或生成视频。
calibration:
  # 每个数据集使用的真实校准视频数量；M04 会覆盖该值。
  real_videos_per_dataset: 200
  # 校准真实视频抽样种子；M04 会覆盖该值以测试稳定性。
  seed: 17
  # 强制校准 real 与 evaluation real 的视频身份无交集。
  disjoint_from_evaluation: true
  # 视频级重校准规则；须与实际有效窗口数 K 对齐。
  video_level: effective_k_matched_empirical_cdf

# 当前运行的数据范围与 manifest 根目录。外部实验只覆盖 datasets 字段。
data:
  # 默认开发集：ComGenVid、VideoFeedback、GenVideo。
  datasets: [comgenvid, videofeedback, genvideo]
  # 三个开发数据集的 calibration/evaluation manifest 所在目录。
  development_manifests: data/manifests/development
  # 外部数据集的 calibration/evaluation manifest 所在目录。
  external_manifests: data/manifests/external
  # 2 秒窗口不足时的处理。当前固定为 exclude，并在每个 run manifest 记录排除数量。
  short_video_policy: exclude

# 特征缓存与数值运行资源。缓存保存 K=3 均匀窗口并集，避免保存不参与主实验的帧。
runtime:
  # 严格缓存根目录；不可与历史 legacy cache 混用。
  cache_dir: cache/patch_embeddings_k3_2s_8fps
  # 缓存覆盖的最大均匀窗口数；K=1/K=2/K=3 均可直接复用该缓存。
  cache_window_count: 3
  # 缓存验证模式；主实验固定 strict。
  cache_policy: strict
  # DINO 特征和高斯评分使用的计算设备。
  device: cuda:0
  # 可选的评分设备列表。留空时仅使用 device；填入两个设备时只并行 evaluation 评分。
  # 示例：[cuda:0, cuda:1]。校准参数仍在第一张卡拟合，保证统计定义不变。
  devices: []
  # 主实验开始前要求目标 GPU 的最小空闲显存，防止与其他任务争抢显存。
  minimum_free_gib: 12
  # 每一类高斯白化最多采样的特征行数，控制显存和内存占用。
  max_features_for_fit: 300000
  # 单批预取的视频数；只影响缓存读取与数据传输吞吐，不改变任一窗口的评分公式。
  score_batch_size: 16
  # 可选复用一个已完成 run 的逐窗口 Global STALL 分数；null 表示正常重新计算。
  # Stage 2 多个 Local 表示共享完全相同的 Global 时可指定基线 run，避免重复高维评分。
  reuse_global_run: null
  # 同时读取严格缓存的线程数。packed shard 已按顺序完整读入内存，机械盘环境下单线程更稳定。
  cache_io_workers: 1
  # evaluation 遇到 packed index 时，运行器自动按连续且互斥的 shard 区间分配 GPU worker，
  # 避免多个进程在机械盘上交错加载同一个 1 GiB 级 shard；无需手动开关。

# 全部方法共享的评价口径；分数越高均表示更接近真实视频。
metrics:
  # 固定分数方向，避免不同方法在 AUC/AP 中被反向解释。
  score_direction: higher_is_real
  # AP 的正类定义。
  positive_class: real
  # 论文配对宏平均：每个生成器与等量真实视频配对时使用的固定抽样种子。
  # 该值与锁定 U0 主表一致，不能隐式复用 calibration.seed。
  pairwise_seed: 42
  # 主表必报指标。
  primary: [auc, ap_real]
  # 附加运行点指标。
  additional: [tpr_at_0_1pct_fpr, tpr_at_1pct_fpr, fpr_at_95pct_tpr]
  # 视频级 paired bootstrap 的重复次数。
  bootstrap_iterations: 1000
