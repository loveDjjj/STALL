# 原论文主线R0/GT专家/Local专家/两者组合，固定协议，不扫描参数。
protocol: mainline_covariance_experts_v1
run_directory: results/runs/mainline_experts
experts: 2
pool_weight: 0.5
ridge: 0.00001
seed: 17
# 一个固定源级80/20真实留出，仅诊断，不调参数。
holdout_fraction: 0.2
datasets: [comgenvid, videofeedback, genvideo]
query_batch: 8
bootstrap_iterations: 1000
bootstrap_seed: 17
