schema_version: alpha_stalled_cache_inventory_v1
snapshot_id: cache_inventory_20260814

policy:
  cache_root: cache
  deletion_mode: manual_approval_only

groups:
  - cache_id: protocol_indexes
    path: cache/indexes
    family: indexes
    dataset_scope: all
    purpose: Enriched video indexes, calibration subsets, and evaluation holdout manifests.
    lifecycle: protocol_index
    retention: keep
    cleanup_priority: P0_keep
    release_dependency: false
    rebuildable: false
    producer: src/video_index.py and protocol-specific manifest builders
    rebuild_command: null
    current_consumers:
      - src/eval.py
      - src/eval_patch.py
      - tools/prefill_patch_cache.py
      - tools/score_u0_locked_windows.py
    metadata_status: external_only
    payload_contract: CSV rows contain video identity, metadata, and deterministic frame-index columns.
    cache_key:
      present:
        - video_path
        - subset
        - source_model
        - fps
        - duration
        - frame_indices
      missing:
        - source_video_sha256
        - index_builder_git_commit
        - ffprobe_version
    hash_contents: true
    notes: Small protocol-bearing assets; base indexes are reproducible, but no single retained command rebuilds every derived holdout and calibration CSV exactly.

  - cache_id: global_demo_compact
    path: cache/embeddings/demo_dataset_duration2_filtered
    family: global_embeddings
    dataset_scope: demo
    purpose: Small two-second global feature cache used for smoke tests and examples.
    lifecycle: feature_cache
    retention: keep
    cleanup_priority: P0_keep
    release_dependency: false
    rebuildable: true
    producer: src/eval.py via src/dataset_utils.py
    rebuild_command: python src/eval.py --csv cache/indexes/demo_dataset_duration2_filtered.csv --emb-cache cache/embeddings/demo_dataset_duration2_filtered --duration 2 --output-csv <output.csv>
    current_consumers:
      - src/eval.py
      - tests and smoke runs
    metadata_status: partial
    payload_contract: One float32 tensor per video with shape [sampled_frames, 1024].
    cache_key:
      present:
        - subset
        - source_model
        - video_stem
        - requested_duration_suffix
      missing:
        - checkpoint_sha256
        - dinov3_commit
        - output_layer
        - preprocessing
        - frame_grouping
        - numerical_implementation
        - source_video_fingerprint
    hash_contents: false
    notes: Retain because it is small and useful for fast integration checks.

