# 首轮专家的后续归因；继承原版单窗和已冻结Gaussian，不重新拟合。
protocol: official_spatial_temporal_expert_controls_v1
# 首轮已验收结果目录，只读；非原论文主线。
source_directory: results/runs/global_experts
# 本轮独立产物目录；不覆盖首轮。
run_directory: results/runs/global_expert_controls
# 统计batch必须与首轮一致；尾部补计算后裁去。
query_batch: 4
# 固定源组配对Poisson bootstrap次数与种子；不重抽拟合参考。
bootstrap_iterations: 1000
bootstrap_seed: 17
# CPU独立对比进程数，不影响统计定义。
analysis_workers: 6
