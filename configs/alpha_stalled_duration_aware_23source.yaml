release:
  name: Alpha-STALLED-duration-aware-full
  protocol_version: duration_aware_23source_v1
  score_direction: higher_is_real
  selection_status: frozen_before_generated_video_scoring

implementation:
  base_method_config: configs/alpha_stalled_u0_locked.yaml
  manifest: results/duration_aware_23source/protocol_tasks.csv
  calibration_membership: results/duration_aware_23source/calibration_membership.csv
  result_directory: results/duration_aware_23source
  report: reports/duration_aware_23source_full.md

sampling:
  nominal_fps: 8
  long_video:
    window_seconds: 2
    frames_per_window: 16
    mode: deterministic_uniform_K3
  short_video:
    window_seconds: 1
    frames_per_window: 8
    mode: deterministic_current_K1
  duration_rule: use_2s_when_valid_else_1s
  duplicate_frames: false
  partial_windows: false
  known_decode_exclusions: configs/multi_window_exclusions.csv
  exclusion_rule: remove_only_the_listed_window_keep_remaining_effective_K

calibration:
  generated_videos: 0
  selection: predeclared_nested_maximum_disjoint_real_pool
  candidates:
    n200:
      comgenvid: 200
      videofeedback: 200
      genvideo: 200
    nmax:
      comgenvid: 800
      videofeedback: 500
      genvideo: 2000
    ncustom_real_only:
      comgenvid: 600
      videofeedback: 400
      genvideo: 1500
  size_curve:
    comgenvid: [200, 400, 600, 800]
    videofeedback: [200, 300, 400, 500]
    genvideo: [200, 500, 1000, 1500, 2000]
  custom_selection:
    artifact: results/duration_aware_23source/real_only_curve/selected_calibration_sizes.json
    artifact_sha256: e85d1247a25d3e4cdd942924778c70d2957bb559227d7dfe80fcaaae75dd85b9
    criterion: held_out_real_weighted_quantile_mse_one_standard_error
    generated_videos_used: 0
    held_out_real:
      comgenvid: 200
      videofeedback: 100
      genvideo: 500
  selection_prohibition:
    - generated_video_metrics
    - generator_labels
    - target_oracle_weights

method:
  global_window: G_k = 0.5 * global_spatial_k + 0.5 * global_T1_k
  local_window: L_k = 0.1 * patch_spatial_k + 0.9 * same_grid_patch_D2_k
  long_video_aggregation: mean_over_K3
  short_video_aggregation: K1
  final: S = 0.6 * G + 0.4 * L

evaluation:
  primary: pairwise_balanced_by_generator_with_exact_real_duration_matching
  protocols:
    - full23
    - strict20_2s
  calibration_controls:
    - n200
    - nmax
    - ncustom_real_only
  real_positive_ap: true
  bootstrap_iterations: 1000
  bootstrap_unit: matched_real_fake_pair_within_generator
