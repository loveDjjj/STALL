# 新监督协议；不替换paper.yaml，不复用目标域Gaussian作为分类输入。
protocol: frozen_evidence_moe_v1
# 当前研究唯一输出位置，恢复要求配置/代码/输入hash一致。
run_directory: results/runs/discriminative_moe
# 复用已验收FC窗口与Global特征；仅读取其中evaluation身份，不使用VATEX CDF。
evidence_directory: results/runs/mainline_experts
# 开发域；外部GenVidBench/ViF不用于选择模型。
datasets: [comgenvid, videofeedback, genvideo]
# 两个最小容量候选；根据各fold训练侧验证决定，不看该fold测试域。
expert_candidates: [2, 4]
# 训练侧按源组保留20%验证；同源短长身份不可分开。
validation_fraction: 0.2
# 数据划分、固定随机投影，与模型初始化seed分开。
split_seed: 17
projection_seed: 1729
# T1/D2用64个固定正交方向的非对角二阶矩，补充1024通道一/二阶矩。
projection_dimension: 64
# 模型重复训练，报告所有seed，不选择最好seed。
model_seeds: [17, 29, 43]
# MLP对照128隐单元；MoE总参数量约匹配，专家越多每个越窄。
hidden_budget: 128
# 学习率与正则固定；验证只选epoch和2/4专家数量。
learning_rate: 0.001
weight_decay: 0.0001
epochs: 30
batch_size: 128
# 每视频窗口均值后计算BCE，训练采样按域/真假/生成器/源支持平衡。
dropout: 0.1
# 小型软路由全部专家计算，不做硬Top-K。固定轻量批平均负载正则。
balance_weight: 0.01
# 冻结DINO数值合同与既有FC Global完全对齐。
feature_batch: 8
decode_workers: 4
prefetch_depth: 6
prefetch_gib: 4
