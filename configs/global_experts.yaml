# 原版单窗Global：总体、离线4专家、在线相似512、在线随机512。
protocol: global_experts_end_to_end_cdf
# 所有统计模型保持同一1024维空间；只用拟合real估计。
dimension: 1024
experts: 4
neighbors: 512
shrinkage: 0.5
ridge: 0.00001
min_fit_sources: 128
# 内容聚类/随机邻居种子；空间抽帧统一使用官方42。
seed: 17
spatial_frame_seed: 42
# 图像单视频前向遵循官方上限32，不跨视频拼batch、不补尾批。
encoder_batch: 32
# 统计查询固定批量，尾批只补计算查询，输出裁回真实数量。
query_batch: 4
# 每个GPU解码进程的有界预取，容量是准入预算。
decode_workers: 4
prefetch_depth: 6
prefetch_memory_mb: 4096
cache_directory: cache/global/stall_single_windows
manifest_directory: data/manifests/global_experts
run_directory: results/runs/global_experts
