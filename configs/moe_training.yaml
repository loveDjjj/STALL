# 独立的容量/预热诊断；沿用既有长度匹配监督数据合同。
protocol: moe_capacity_warmup_v1
# 新结果目录；不覆盖上轮216模型。
run_directory: results/runs/moe_training
# 只读复用Global、划分、外部特征和既有窄预算结果。
source_directory: results/runs/discriminative_moe
# 三个留域fold及一个pooled外部模型。
datasets: [comgenvid, videofeedback, genvideo]
# 固定三seed，全部报告，不择优。
seeds: [17, 29, 43]
# 单MLP宽256，双专家每个128；不搜索数量。
hidden_budget: 256
experts: 2
# 总30轮；warm组前10轮gate冻结为均匀，后20轮解冻。
epochs: 30
warmup_epochs: 10
# 延续上轮优化器及训练预算；这些均影响实验协议。
learning_rate: 0.001
weight_decay: 0.0001
dropout: 0.1
batch_size: 128
balance_weight: 0.01
gradient_clip: 5.0
# 只作诊断的训练侧内容聚类，不进入网络或选择损失。
diagnostic_clusters: 2
diagnostic_seed: 17
# 配对源组重抽样，三seed共享每次权重。
bootstrap_iterations: 1000
bootstrap_seed: 17
