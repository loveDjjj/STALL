# 单窗T1参考来源诊断；不使用专家、Local或FC，不更换官方空间。
protocol: native_t1_reference_sources_v1
# 首轮只读Global缓存/模型及评价身份。
source_directory: results/runs/global_experts
# 本轮独立结果目录。
run_directory: results/runs/global_reference_sources
# 新目标真实native窗口Global；不覆盖旧Uniform缓存。
cache_directory: cache/global/target_single_windows
# 每源仅取一个片段；数字是独立源数，不是旧片段数。
source_counts:
  comgenvid: 132
  videofeedback: 200
  genvideo: 200
# 源顺序/源内片段确定性选择及5折分配种子；不用评价分数。
seed: 17
# 真实留出只诊断，不选参数；同源不拆分。
folds: 5
# 与首轮同样的完整维度和固定ridge，不新增收缩。
ridge: 0.00001
dimension: 1024
# 官方前向：单视频、不补尾帧；统计查询批量固定。
encoder_batch: 32
query_batch: 4
# 每GPU有界解码准备。
decode_workers: 4
prefetch_depth: 6
prefetch_memory_mb: 2048
# 固定参考下源组配对区间；不模拟参考重抽样。
bootstrap_iterations: 1000
bootstrap_seed: 17
analysis_workers: 5
