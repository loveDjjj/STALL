    description: Superseded, rejected, or protocol-specific experiment entrypoints retained only for exact historical reproduction.
    new_work_policy: Do not use for new parameter searches or main claims; changes are limited to compatibility and verified refactors.
    archive_policy: Move only as a complete retained family or with explicit evidence and compatibility-path preservation.
