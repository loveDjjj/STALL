    description: Deterministic repository catalogs, manifests, provenance capture, and consistency verifiers.
    new_work_policy: May evolve only with schema tests, deterministic generated artifacts, and documentation checks.
    archive_policy: Keep active while the governed asset exists; governance entrypoints must remain independent of other CLIs.
