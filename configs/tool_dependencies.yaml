      - score_u0_locked_k1_cache
      - score_u0_locked_windows
      - verify_u0_locked_release
      - verify_u0_pipeline_reconstruction
  - lifecycle: paper_evidence
    description: Controlled ablations, extensions, robustness studies, and paper asset builders supporting the current manuscript.
    new_work_policy: New runs require frozen factors, an experiment ID, leakage declarations, and registration before manuscript use.
    archive_policy: Retain through review and artifact release; archive only with result manifests and stable compatibility commands.
    tools:
