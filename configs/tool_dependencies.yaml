lifecycle_classes:
  - lifecycle: formal_release
    description: Canonical locked-U0 release, public inference, and exact reproduction entrypoints.
    new_work_policy: Bug fixes require locked-result regression evidence; behavior changes require a new protocol and release ID.
    archive_policy: Never archive while u0_locked_v1 is the current release; preserve public command paths.
    tools:
      - analyze_u0_locked
      - build_u0_release_manifests
      - eval_alpha_stalled
      - finalize_u0_locked_calibration_reference
      - finalize_u0_locked_shard
