  - lifecycle: research_utility
    description: Exploratory audits, benchmarks, token inspection, and generic summaries that are not authoritative claim sources.
    new_work_policy: Results remain diagnostic until promoted through a registered protocol and evidence review.
    archive_policy: May be archived independently after confirming that no active script, report command, or cache workflow references it.
    tools:
      - prefill_patch_cache
  - lifecycle: compatibility
    description: Legacy generic command surfaces retained for existing callers but not used as current protocol authorities.
    new_work_policy: Do not add new method logic; route reusable behavior through src/alpha_stalled and preserve command compatibility.
    archive_policy: Remove only after repository-wide reference checks and a documented replacement command.
    tools:
