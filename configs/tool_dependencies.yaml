retained_families:
  - family_id: d3_operator_controls
    status: frozen_historical
    tools:
      - analyze_global_d3_variants
      - build_multi_order_baselines
      - evaluate_d3_pixel_robustness
      - evaluate_d3_robustness
    evidence_paths:
      - reports/global_local_multi_order_final.md
      - results/multi_order_baselines/global_d3_dataset_metrics.csv
      - results/multi_order_baselines/d3_robustness_dataset_metrics.csv
      - results/multi_order_baselines/d3_pixel_robustness_dataset_metrics.csv
    archive_target: research_archive/tools/d3_operator_controls
    reason: These scripts reproduce the rejected DINOv3 operator-controlled D3 family and share its exact historical cache and calibration semantics.
    archive_gate: Move only with a compatibility wrapper, the registered result files, and a command manifest that reproduces all three dataset-metric tables.
  - family_id: keyframe_case_visualization
    status: frozen_supplement
    tools:
      - create_keyframe_case_explanations
      - create_patch_case_visualizations
    evidence_paths:
      - reports/u0_localization_and_injection.md
      - paper/ieee_alpha_stalled/figures/results/keyframe_patch_anomaly_cases_main.png
      - paper/ieee_alpha_stalled/tables/keyframe_case_summary.tex
    archive_target: research_archive/tools/keyframe_case_visualization
    reason: The explanation generator is a thin second stage of the paper's frozen qualitative patch-visualization workflow.
    archive_gate: Move only after the paper figure and table have a standalone source-data manifest and their current paths remain available through wrappers.
  - family_id: multiscale_intermediate_layers
    status: frozen_historical
    tools:
      - fit_clean_universal_layer17
      - fit_intermediate_layer_params
      - score_intermediate_layer_windows
      - score_unified_multiscale_windows
    evidence_paths:
      - reports/unified_multiscale_intermediate_layers.md
      - reports/clean_universal_cross_layer_final.md
      - results/unified_multiscale_layers/layer_dataset_metrics.csv
      - results/clean_universal/cross_layer_dataset_metrics.csv
    archive_target: research_archive/tools/multiscale_intermediate_layers
    reason: These fitters and scorers form the rejected multiscale and DINO intermediate-layer experiment family with shared frozen registries.
    archive_gate: Move only after parameter files, raw score shards, checkpoint identity, and the four registered result files are captured by an archival run manifest.
  - family_id: u0_robustness_injection
    status: frozen_supplement
    tools:
      - score_u0_injections
      - score_u0_robustness
    evidence_paths:
      - reports/u0_robustness.md
      - reports/u0_localization_and_injection.md
      - results/u0_robustness/analysis/dataset_metrics.csv
      - results/u0_injection/analysis/score_response.csv
    archive_target: research_archive/tools/u0_robustness_injection
    reason: Synthetic injection scoring intentionally reuses the frozen robustness perturbation and raw U0 scoring implementation.
    archive_gate: Keep in place while robustness and localization are paper supplements; move only with wrapper commands and manifests for both result directories.

# Every remaining tools -> tools edge is explicit. New code must use src/alpha_stalled instead.
allowed_edges:
  - source: analyze_global_d3_variants
    target: build_multi_order_baselines
    imported_symbols: [GLOBAL_D3_CONFIG_NAMES]
    category: historical_d3
    migration_status: retain_historical
    family_id: d3_operator_controls
    reason: Shares names for the frozen historical D3 variant family.
  - source: create_keyframe_case_explanations
    target: create_patch_case_visualizations
    imported_symbols: [FastPatchScorer, compute_anomaly_fields]
    category: research_visualization
    migration_status: retain_historical
    family_id: keyframe_case_visualization
    reason: Both scripts form one frozen qualitative visualization workflow.
  - source: evaluate_d3_pixel_robustness
    target: build_multi_order_baselines
    imported_symbols: [KEY_COLUMNS, _load_index, d3_statistics, dataset_specs, empirical_cdf, two_sided_realness]
