      <svg xmlns="http://www.w3.org/2000/svg" class="scientific-flow" viewBox="0 0 1400 1940" role="img"
           aria-label="真实视频先建立全局和局部参考统计，待测视频再经过同一 DINOv3 提取全局与 patch 证据，最终固定融合得到真实性分数">
        <defs>
          <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F4D92"/>
          </marker>
          <marker id="arrow-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
          </marker>
          <marker id="arrow-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#A64C61"/>
          </marker>
          <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#42949E"/>
          </marker>
          <style>
            .t { font-family: "Noto Serif CJK SC", "Times New Roman", serif; }
            .stage { font-size: 15px; font-weight: 700; }
            .title { font-size: 22px; font-weight: 700; }
            .body { font-size: 15px; }
            .small { font-size: 13px; }
            .formula { font-size: 14px; font-style: italic; }
            .ink { fill: #202328; }
            .muted { fill: #5D6672; }
            .blue { fill: #0F4D92; }
            .rose { fill: #8F3C50; }
            .teal { fill: #2E7780; }
            .white { fill: #FFFFFF; }
            .line-blue { fill: none; stroke: #0F4D92; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
            .line-gray { fill: none; stroke: #6B7280; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-gray); }
            .line-rose { fill: none; stroke: #A64C61; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-rose); }
            .line-teal { fill: none; stroke: #42949E; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-teal); }
            .dash { stroke-dasharray: 7 6; }
          </style>
        </defs>

        <rect x="0" y="0" width="1400" height="1940" fill="#FFFFFF"/>

        <!-- Phase 01 -->
        <line x1="64" y1="44" x2="64" y2="566" stroke="#D8DDE5" stroke-width="4"/>
        <circle cx="64" cy="74" r="27" fill="#0F4D92"/>
        <text x="64" y="82" text-anchor="middle" class="t title white">1</text>
        <text x="112" y="65" class="t stage blue">REFERENCE CONSTRUCTION · REAL-ONLY CALIBRATION</text>
        <text x="112" y="94" class="t title ink">使用真实视频重建特征分布与似然参考</text>
        <text x="112" y="119" class="t body muted">只拟合真实视频统计，不使用任何生成视频标签或分类器训练</text>

        <!-- Calibration input row -->
        <rect x="105" y="158" width="250" height="104" rx="4" fill="#EAF0F8" stroke="#0F4D92" stroke-width="2"/>
        <text x="128" y="188" class="t stage blue">01 · REAL VIDEOS</text>
        <text x="230" y="222" text-anchor="middle" class="t title ink">真实视频校准集</text>
        <text x="230" y="247" text-anchor="middle" class="t body muted">VATEX / 独立真实参考集</text>

        <path d="M355 210 L410 210" class="line-blue"/>

        <rect x="415" y="158" width="250" height="104" rx="4" fill="#F4F7FB" stroke="#7597BE" stroke-width="1.7"/>
        <text x="438" y="188" class="t stage blue">02 · FRAME SAMPLING</text>
        <text x="540" y="222" text-anchor="middle" class="t title ink">固定时间窗口采样</text>
        <text x="540" y="247" text-anchor="middle" class="t body muted">8 FPS · 默认 2 秒 · 16 帧</text>

        <path d="M665 210 L720 210" class="line-blue"/>

        <rect x="725" y="158" width="250" height="104" rx="4" fill="#0F4D92" stroke="#0A3B72" stroke-width="2"/>
        <text x="748" y="188" class="t stage" fill="#DCE8F5">03 · SHARED BACKBONE</text>
        <text x="850" y="222" text-anchor="middle" class="t title white">DINOv3 ViT-L/16</text>
        <text x="850" y="247" text-anchor="middle" class="t body" fill="#DCE8F5">同时输出 Global 与 Patch Token</text>

        <!-- Backbone split -->
        <path d="M975 210 L1030 210 L1030 168 L1064 168" class="line-rose"/>
        <path d="M975 210 L1030 210 L1030 346 L1064 346" class="line-teal"/>
        <text x="1012" y="198" text-anchor="end" class="t small muted">特征分流</text>

        <!-- Global calibration -->
        <rect x="1070" y="132" width="270" height="142" rx="4" fill="#F8ECEF" stroke="#A64C61" stroke-width="2"/>
        <text x="1093" y="162" class="t stage rose">04A · GLOBAL REFERENCE</text>
        <text x="1205" y="194" text-anchor="middle" class="t title ink">全局参考统计</text>
        <text x="1094" y="222" class="t body muted">空间：帧级 Global Token</text>
        <text x="1094" y="246" class="t body muted">时序：归一化一阶帧间差分</text>
        <text x="1094" y="266" class="t small rose">拟合 μ / W 与校准 likelihood</text>

        <!-- Patch calibration -->
        <rect x="1070" y="294" width="270" height="158" rx="4" fill="#E8F3F4" stroke="#42949E" stroke-width="2"/>
        <text x="1093" y="324" class="t stage teal">04B · PATCH REFERENCE</text>
        <text x="1205" y="356" text-anchor="middle" class="t title ink">局部参考统计</text>
        <text x="1094" y="384" class="t body muted">空间：14 × 14 Patch Token</text>
        <text x="1094" y="408" class="t body muted">时序：同网格二阶差分</text>
        <text x="1094" y="432" class="t small teal">拟合 μ / W 与校准 likelihood</text>

        <!-- Frozen reference -->
        <path d="M1205 274 L1380 274 L1380 478 L800 478 L800 514" class="line-rose"/>
        <path d="M1205 452 L1205 492 L1110 492 L1110 514" class="line-teal"/>
        <text x="785" y="470" text-anchor="end" class="t small rose">Global 参数</text>
        <text x="1095" y="484" text-anchor="end" class="t small teal">Patch 参数</text>
        <rect x="505" y="520" width="900" height="112" rx="4" fill="#F1F2F4" stroke="#767F8B" stroke-width="1.7"/>
        <text x="536" y="553" class="t stage muted">05 · FROZEN REAL REFERENCE</text>
        <text x="955" y="585" text-anchor="middle" class="t title ink">冻结真实视频统计库</text>
        <text x="955" y="610" text-anchor="middle" class="t body muted">Global / Patch 的 whitening 参数 μ、W + 视频级校准分数 CDF</text>

        <!-- Phase divider -->
        <line x1="64" y1="566" x2="64" y2="1575" stroke="#D8DDE5" stroke-width="4"/>
        <circle cx="64" cy="690" r="27" fill="#A64C61"/>
        <text x="64" y="698" text-anchor="middle" class="t title white">2</text>
        <text x="112" y="681" class="t stage rose">VIDEO INFERENCE · GLOBAL-LOCAL EVIDENCE</text>
        <text x="112" y="710" class="t title ink">待测视频沿固定路径计算全局与局部真实性证据</text>
        <text x="112" y="735" class="t body muted">每个视频独立推理；固定主流程不读取真假标签或生成器来源</text>

        <!-- Inference input -->
        <rect x="105" y="774" width="250" height="102" rx="4" fill="#F8ECEF" stroke="#A64C61" stroke-width="2"/>
        <text x="128" y="804" class="t stage rose">06 · INPUT VIDEO</text>
        <text x="230" y="838" text-anchor="middle" class="t title ink">待检测视频</text>
        <text x="230" y="862" text-anchor="middle" class="t body muted">未知真实 / 生成标签</text>

        <path d="M355 825 L410 825" class="line-gray"/>

        <rect x="415" y="774" width="250" height="102" rx="4" fill="#F4F7FB" stroke="#7597BE" stroke-width="1.7"/>
        <text x="438" y="804" class="t stage blue">07 · SAME SAMPLING</text>
        <text x="540" y="838" text-anchor="middle" class="t title ink">8 FPS 固定窗口</text>
        <text x="540" y="862" text-anchor="middle" class="t body muted">与真实校准阶段保持一致</text>

        <path d="M665 825 L720 825" class="line-blue"/>

        <rect x="725" y="774" width="250" height="102" rx="4" fill="#0F4D92" stroke="#0A3B72" stroke-width="2"/>
        <text x="748" y="804" class="t stage" fill="#DCE8F5">08 · FEATURE EXTRACTION</text>
        <text x="850" y="838" text-anchor="middle" class="t title white">DINOv3 ViT-L/16</text>
        <text x="850" y="862" text-anchor="middle" class="t body" fill="#DCE8F5">共享骨干 · 无参数更新</text>

        <!-- Branch split labels -->
        <path d="M850 876 L850 916 L365 916 L365 940" class="line-rose"/>
        <path d="M850 876 L850 916 L1060 916 L1060 940" class="line-teal"/>
        <circle cx="850" cy="916" r="5" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
        <rect x="108" y="947" width="522" height="46" rx="4" fill="#F8ECEF" stroke="#A64C61" stroke-width="1.5"/>
        <text x="369" y="977" text-anchor="middle" class="t stage rose">GLOBAL BRANCH · 原版 STALL 全局证据</text>
        <rect x="770" y="947" width="570" height="46" rx="4" fill="#E8F3F4" stroke="#42949E" stroke-width="1.5"/>
        <text x="1055" y="977" text-anchor="middle" class="t stage teal">PATCH BRANCH · 局部二阶时序证据</text>

        <!-- Global branch -->
        <rect x="108" y="1018" width="522" height="94" rx="4" fill="#FFFFFF" stroke="#A64C61" stroke-width="1.7"/>
        <text x="132" y="1048" class="t stage rose">09A · FRAME-LEVEL FEATURES</text>
        <text x="369" y="1080" text-anchor="middle" class="t title ink">帧级 Global Token 序列</text>
        <text x="369" y="1102" text-anchor="middle" class="t body muted">G ∈ R^(T × 1024)</text>

        <path d="M369 1112 L369 1138 L231 1138 L231 1151" class="line-rose"/>
        <path d="M369 1138 L507 1138 L507 1151" class="line-rose"/>
        <circle cx="369" cy="1138" r="5" fill="#FFFFFF" stroke="#A64C61" stroke-width="1.5"/>

        <rect x="108" y="1158" width="246" height="152" rx="4" fill="#F8ECEF" stroke="#A64C61" stroke-width="1.7"/>
        <text x="130" y="1188" class="t stage rose">10A · SPATIAL</text>
        <text x="231" y="1220" text-anchor="middle" class="t title ink">全局空间似然</text>
        <text x="231" y="1247" text-anchor="middle" class="t formula muted">z = (g_t - μ_s) W_s</text>
        <text x="231" y="1272" text-anchor="middle" class="t body muted">高斯 LL · 帧间 max 聚合</text>
        <text x="231" y="1295" text-anchor="middle" class="t small rose">回答：整帧外观是否真实</text>

        <rect x="384" y="1158" width="246" height="152" rx="4" fill="#F8ECEF" stroke="#A64C61" stroke-width="1.7"/>
        <text x="406" y="1188" class="t stage rose">10B · TEMPORAL</text>
        <text x="507" y="1220" text-anchor="middle" class="t title ink">全局一阶时序似然</text>
        <text x="507" y="1247" text-anchor="middle" class="t formula muted">d_t = Norm(g_(t+1) - g_t)</text>
        <text x="507" y="1272" text-anchor="middle" class="t body muted">高斯 LL · 帧间 min 聚合</text>
        <text x="507" y="1295" text-anchor="middle" class="t small rose">回答：整体运动是否自然</text>

        <path d="M231 1310 L231 1342 L369 1342 L369 1368" class="line-rose"/>
        <path d="M507 1310 L507 1342 L369 1342" class="line-rose"/>

        <rect x="108" y="1374" width="522" height="118" rx="4" fill="#F1F2F4" stroke="#767F8B" stroke-width="1.5"/>
        <text x="132" y="1404" class="t stage muted">11A · REAL-CDF CALIBRATION</text>
        <text x="369" y="1437" text-anchor="middle" class="t title ink">映射到真实参考 Percentile</text>
        <text x="369" y="1465" text-anchor="middle" class="t body muted">Global Score = 0.5 × Spatial + 0.5 × Temporal</text>

        <!-- Patch branch -->
        <rect x="770" y="1018" width="570" height="94" rx="4" fill="#FFFFFF" stroke="#42949E" stroke-width="1.7"/>
        <text x="794" y="1048" class="t stage teal">09B · LOCAL TOKEN FIELD</text>
        <text x="1055" y="1080" text-anchor="middle" class="t title ink">14 × 14 Patch Token 时空网格</text>
        <text x="1055" y="1102" text-anchor="middle" class="t body muted">P ∈ R^(T × 196 × 1024) · 可选 region pooling</text>

        <path d="M1055 1112 L1055 1138 L905 1138 L905 1151" class="line-teal"/>
        <path d="M1055 1138 L1205 1138 L1205 1151" class="line-teal"/>
        <circle cx="1055" cy="1138" r="5" fill="#FFFFFF" stroke="#42949E" stroke-width="1.5"/>

        <rect x="770" y="1158" width="270" height="152" rx="4" fill="#E8F3F4" stroke="#42949E" stroke-width="1.7"/>
        <text x="792" y="1188" class="t stage teal">10C · LOCAL SPATIAL</text>
        <text x="905" y="1220" text-anchor="middle" class="t title ink">Patch 空间似然</text>
        <text x="905" y="1247" text-anchor="middle" class="t formula muted">z_(t,i) = (p_(t,i) - μ_ps) W_ps</text>
        <text x="905" y="1272" text-anchor="middle" class="t body muted">Mean / Bottom-k 聚合</text>
        <text x="905" y="1295" text-anchor="middle" class="t small teal">定位局部外观异常</text>

        <rect x="1070" y="1158" width="270" height="152" rx="4" fill="#E8F3F4" stroke="#42949E" stroke-width="1.7"/>
        <text x="1092" y="1188" class="t stage teal">10D · 2ND-ORDER TEMPORAL</text>
        <text x="1205" y="1220" text-anchor="middle" class="t title ink">同网格二阶时序似然</text>
        <text x="1205" y="1247" text-anchor="middle" class="t formula muted">a_(t,i) = p_(t+2,i) - 2p_(t+1,i) + p_(t,i)</text>
        <text x="1205" y="1272" text-anchor="middle" class="t body muted">L2 归一化 · 高斯 LL · 聚合</text>
        <text x="1205" y="1295" text-anchor="middle" class="t small teal">捕获闪烁、跳变与局部不连续</text>

        <path d="M905 1310 L905 1342 L1055 1342 L1055 1368" class="line-teal"/>
        <path d="M1205 1310 L1205 1342 L1055 1342" class="line-teal"/>

        <rect x="770" y="1374" width="570" height="118" rx="4" fill="#F1F2F4" stroke="#767F8B" stroke-width="1.5"/>
        <text x="794" y="1404" class="t stage muted">11B · REAL-CDF CALIBRATION</text>
        <text x="1055" y="1437" text-anchor="middle" class="t title ink">映射到真实参考 Percentile</text>
        <text x="1055" y="1465" text-anchor="middle" class="t body muted">Local Score = Φ_local(Spatial, Temporal)</text>

        <!-- Frozen reference dependencies -->
        <path d="M625 632 L625 654 L86 654 L86 1433 L101 1433" class="line-gray dash"/>
        <path d="M1110 632 L1110 654 L1360 654 L1360 1433 L1347 1433" class="line-gray dash"/>
        <rect x="76" y="1282" width="20" height="116" fill="#FFFFFF"/>
        <text x="91" y="1340" transform="rotate(-90 91 1340)" text-anchor="middle" class="t small muted">冻结 Global 参考 CDF</text>
        <rect x="1350" y="1282" width="20" height="116" fill="#FFFFFF"/>
        <text x="1365" y="1340" transform="rotate(-90 1365 1340)" text-anchor="middle" class="t small muted">冻结 Patch 参考 CDF</text>

        <!-- Diagnostic output -->
        <path d="M1205 1310 L1205 1328 L1378 1328 L1378 1555 L1347 1555" class="line-teal dash"/>
        <rect x="1010" y="1512" width="330" height="86" rx="4" fill="#FFFFFF" stroke="#42949E" stroke-width="1.5" stroke-dasharray="6 5"/>
        <text x="1032" y="1542" class="t stage teal">AUXILIARY DIAGNOSIS</text>
        <text x="1175" y="1573" text-anchor="middle" class="t body ink">异常帧与 Patch 区域定位</text>
        <text x="1175" y="1592" text-anchor="middle" class="t small muted">不改变主检测分数</text>

        <!-- Phase 03 -->
        <circle cx="64" cy="1630" r="27" fill="#42949E"/>
        <text x="64" y="1638" text-anchor="middle" class="t title white">3</text>
        <text x="112" y="1621" class="t stage teal">FIXED EVIDENCE FUSION · FINAL DECISION</text>
        <text x="112" y="1650" class="t title ink">冻结协议整合全局分数与局部分数</text>

        <path d="M369 1492 L369 1535 L640 1535 L640 1664" class="line-rose"/>
        <path d="M900 1492 L900 1625 L760 1625 L760 1664" class="line-teal"/>
        <text x="626" y="1526" text-anchor="end" class="t small rose">α</text>
        <text x="774" y="1616" class="t small teal">1−α</text>

        <rect x="470" y="1670" width="460" height="90" rx="4" fill="#0F4D92" stroke="#0A3B72" stroke-width="2"/>
        <text x="700" y="1703" text-anchor="middle" class="t stage" fill="#DCE8F5">12 · ALPHA-STALLED FUSION</text>
        <text x="700" y="1737" text-anchor="middle" class="t title white">Final = α × Global + (1−α) × Local</text>

        <path d="M700 1760 L700 1800" class="line-blue"/>
        <rect x="435" y="1806" width="530" height="104" rx="4" fill="#E8F3F4" stroke="#42949E" stroke-width="2"/>
        <text x="700" y="1840" text-anchor="middle" class="t stage teal">13 · FINAL REALNESS SCORE</text>
        <text x="700" y="1873" text-anchor="middle" class="t title ink">最终视频真实性分数</text>
        <text x="700" y="1898" text-anchor="middle" class="t body muted">高分更接近真实视频 · 低分更接近生成视频</text>
      </svg>
