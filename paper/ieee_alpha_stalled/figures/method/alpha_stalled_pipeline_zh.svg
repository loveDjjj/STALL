<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <style>
    .title { font: 700 30px 'PingFang SC','Noto Sans CJK SC',sans-serif; fill: #18324b; }
    .section { font: 700 18px 'PingFang SC','Noto Sans CJK SC',sans-serif; fill: #174f87; }
    .box-title { font: 700 18px 'PingFang SC','Noto Sans CJK SC',sans-serif; fill: #18324b; }
    .box-text { font: 15px 'PingFang SC','Noto Sans CJK SC',sans-serif; fill: #425466; }
    .small { font: 13px 'PingFang SC','Noto Sans CJK SC',sans-serif; fill: #596b7a; }
    .branch { font: 700 17px 'PingFang SC','Noto Sans CJK SC',sans-serif; fill: #ffffff; }
    .output { font: 700 20px 'PingFang SC','Noto Sans CJK SC',sans-serif; fill: #ffffff; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#2869a8"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#b64d5b"/></marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#258d9b"/></marker>
  </defs>
  <rect width="1200" height="1500" fill="#ffffff"/>
  <text x="65" y="62" class="title">Alpha-STALLED：从真实视频校准到待测视频真实性评分</text>
  <line x1="65" y1="85" x2="1135" y2="85" stroke="#d6dee7" stroke-width="2"/>

  <circle cx="70" cy="150" r="24" fill="#255f9d"/><text x="63" y="157" class="branch">1</text>
  <text x="112" y="145" class="section">真实参考统计构建</text>
  <text x="112" y="168" class="small">仅使用与评测集互斥的真实视频</text>
  <rect x="105" y="202" width="220" height="112" rx="5" fill="#f5f9ff" stroke="#2869a8" stroke-width="2"/>
  <text x="215" y="244" text-anchor="middle" class="box-title">真实视频</text>
  <text x="215" y="274" text-anchor="middle" class="box-text">独立真实校准集</text>
  <rect x="385" y="202" width="220" height="112" rx="5" fill="#f5f9ff" stroke="#2869a8" stroke-width="2"/>
  <text x="495" y="244" text-anchor="middle" class="box-title">窗口采样</text>
  <text x="495" y="274" text-anchor="middle" class="box-text">每窗 16 帧，时长 2 秒</text>
  <rect x="665" y="202" width="220" height="112" rx="5" fill="#174f87" stroke="#174f87" stroke-width="2"/>
  <text x="775" y="244" text-anchor="middle" class="branch">冻结 DINOv3 ViT-L/16</text>
  <text x="775" y="274" text-anchor="middle" class="branch">提取全局与局部特征</text>
  <line x1="325" y1="258" x2="385" y2="258" stroke="#2869a8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="605" y1="258" x2="665" y2="258" stroke="#2869a8" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="910" y="170" width="225" height="136" rx="5" fill="#fff5f6" stroke="#b64d5b" stroke-width="2"/>
  <text x="1022" y="210" text-anchor="middle" class="box-title">全局参考统计</text>
  <text x="1022" y="239" text-anchor="middle" class="box-text">全局空间与一阶时序</text>
  <text x="1022" y="265" text-anchor="middle" class="small">白化参数与真实分位数</text>
  <rect x="910" y="332" width="225" height="136" rx="5" fill="#effbfc" stroke="#258d9b" stroke-width="2"/>
  <text x="1022" y="372" text-anchor="middle" class="box-title">局部参考统计</text>
  <text x="1022" y="401" text-anchor="middle" class="box-text">局部空间与同网格二阶时序</text>
  <text x="1022" y="427" text-anchor="middle" class="small">白化参数与真实分位数</text>
  <line x1="885" y1="240" x2="910" y2="240" stroke="#b64d5b" stroke-width="2" marker-end="url(#arrow-red)"/>
  <line x1="885" y1="276" x2="895" y2="276" stroke="#258d9b" stroke-width="2"/><line x1="895" y1="276" x2="895" y2="400" stroke="#258d9b" stroke-width="2"/><line x1="895" y1="400" x2="910" y2="400" stroke="#258d9b" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <rect x="285" y="400" width="575" height="90" rx="5" fill="#f7f8fa" stroke="#7d8a96" stroke-width="2"/>
  <text x="572" y="437" text-anchor="middle" class="box-title">冻结的真实视频参考库</text>
  <text x="572" y="465" text-anchor="middle" class="box-text">保存全局与局部白化参数、经验分布与有效窗口数校准统计</text>
  <line x1="1022" y1="306" x2="1022" y2="365" stroke="#b64d5b" stroke-width="2"/><line x1="1022" y1="468" x2="860" y2="468" stroke="#258d9b" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <line x1="65" y1="535" x2="1135" y2="535" stroke="#d6dee7" stroke-width="2"/>
  <circle cx="70" cy="600" r="24" fill="#b64d5b"/><text x="63" y="607" class="branch">2</text>
  <text x="112" y="595" class="section">待测视频推理与分支打分</text>
  <text x="112" y="618" class="small">不读取测试标签、生成器来源或测试批次组成</text>
  <rect x="105" y="650" width="220" height="102" rx="5" fill="#fff5f6" stroke="#b64d5b" stroke-width="2"/>
  <text x="215" y="689" text-anchor="middle" class="box-title">待测视频</text>
  <text x="215" y="718" text-anchor="middle" class="box-text">真实或生成视频</text>
  <rect x="385" y="650" width="220" height="102" rx="5" fill="#f5f9ff" stroke="#2869a8" stroke-width="2"/>
  <text x="495" y="689" text-anchor="middle" class="box-title">均匀窗口采样</text>
  <text x="495" y="718" text-anchor="middle" class="box-text">最多三个互异 2 秒窗口</text>
  <rect x="665" y="650" width="220" height="102" rx="5" fill="#174f87" stroke="#174f87" stroke-width="2"/>
  <text x="775" y="689" text-anchor="middle" class="branch">冻结 DINOv3</text>
  <text x="775" y="718" text-anchor="middle" class="branch">全局与局部特征提取</text>
  <line x1="325" y1="701" x2="385" y2="701" stroke="#2869a8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="605" y1="701" x2="665" y2="701" stroke="#2869a8" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <rect x="105" y="810" width="420" height="46" rx="4" fill="#b64d5b"/>
  <text x="315" y="840" text-anchor="middle" class="branch">全局分支：继承 STALL 的全局证据</text>
  <rect x="675" y="810" width="420" height="46" rx="4" fill="#258d9b"/>
  <text x="885" y="840" text-anchor="middle" class="branch">局部分支：同网格局部二阶时序证据</text>
  <line x1="775" y1="752" x2="315" y2="752" stroke="#b64d5b" stroke-width="2"/><line x1="315" y1="752" x2="315" y2="810" stroke="#b64d5b" stroke-width="2" marker-end="url(#arrow-red)"/>
  <line x1="775" y1="752" x2="885" y2="752" stroke="#258d9b" stroke-width="2"/><line x1="885" y1="752" x2="885" y2="810" stroke="#258d9b" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <rect x="105" y="890" width="195" height="150" rx="5" fill="#fff5f6" stroke="#b64d5b" stroke-width="2"/>
  <text x="202" y="930" text-anchor="middle" class="box-title">全局空间</text><text x="202" y="960" text-anchor="middle" class="box-text">逐帧真实性似然</text><text x="202" y="987" text-anchor="middle" class="small">窗口内最大汇聚</text>
  <rect x="330" y="890" width="195" height="150" rx="5" fill="#fff5f6" stroke="#b64d5b" stroke-width="2"/>
  <text x="427" y="930" text-anchor="middle" class="box-title">全局一阶时序</text><text x="427" y="960" text-anchor="middle" class="box-text">相邻帧特征差分</text><text x="427" y="987" text-anchor="middle" class="small">窗口内最小汇聚</text>
  <rect x="675" y="890" width="195" height="150" rx="5" fill="#effbfc" stroke="#258d9b" stroke-width="2"/>
  <text x="772" y="930" text-anchor="middle" class="box-title">局部空间</text><text x="772" y="960" text-anchor="middle" class="box-text">图块特征似然</text><text x="772" y="987" text-anchor="middle" class="small">辅助局部证据</text>
  <rect x="900" y="890" width="195" height="150" rx="5" fill="#effbfc" stroke="#258d9b" stroke-width="2"/>
  <text x="997" y="930" text-anchor="middle" class="box-title">局部二阶时序</text><text x="997" y="960" text-anchor="middle" class="box-text">同位置图块加速度</text><text x="997" y="987" text-anchor="middle" class="small">局部主要证据</text>
  <line x1="315" y1="856" x2="202" y2="890" stroke="#b64d5b" stroke-width="2" marker-end="url(#arrow-red)"/><line x1="315" y1="856" x2="427" y2="890" stroke="#b64d5b" stroke-width="2" marker-end="url(#arrow-red)"/>
  <line x1="885" y1="856" x2="772" y2="890" stroke="#258d9b" stroke-width="2" marker-end="url(#arrow-cyan)"/><line x1="885" y1="856" x2="997" y2="890" stroke="#258d9b" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <rect x="170" y="1100" width="310" height="90" rx="5" fill="#f7f8fa" stroke="#7d8a96" stroke-width="2"/>
  <text x="325" y="1138" text-anchor="middle" class="box-title">全局分支视频级校准</text><text x="325" y="1166" text-anchor="middle" class="box-text">窗口均值后映射到真实分位数</text>
  <rect x="720" y="1100" width="310" height="90" rx="5" fill="#f7f8fa" stroke="#7d8a96" stroke-width="2"/>
  <text x="875" y="1138" text-anchor="middle" class="box-title">局部分支视频级校准</text><text x="875" y="1166" text-anchor="middle" class="box-text">窗口均值后映射到真实分位数</text>
  <line x1="202" y1="1040" x2="325" y2="1100" stroke="#b64d5b" stroke-width="2" marker-end="url(#arrow-red)"/><line x1="427" y1="1040" x2="325" y2="1100" stroke="#b64d5b" stroke-width="2" marker-end="url(#arrow-red)"/>
  <line x1="772" y1="1040" x2="875" y2="1100" stroke="#258d9b" stroke-width="2" marker-end="url(#arrow-cyan)"/><line x1="997" y1="1040" x2="875" y2="1100" stroke="#258d9b" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <circle cx="70" cy="1270" r="24" fill="#258d9b"/><text x="63" y="1277" class="branch">3</text>
  <text x="112" y="1265" class="section">固定证据融合与最终判定</text>
  <rect x="340" y="1250" width="520" height="80" rx="5" fill="#174f87" stroke="#174f87" stroke-width="2"/>
  <text x="600" y="1283" text-anchor="middle" class="output">最终融合：0.60 全局 + 0.40 局部</text>
  <text x="600" y="1311" text-anchor="middle" class="branch">Alpha-STALLED 视频级真实性得分</text>
  <line x1="325" y1="1190" x2="500" y2="1250" stroke="#b64d5b" stroke-width="2" marker-end="url(#arrow-red)"/><line x1="875" y1="1190" x2="700" y2="1250" stroke="#258d9b" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <rect x="410" y="1380" width="380" height="70" rx="5" fill="#effbfc" stroke="#258d9b" stroke-width="2"/>
  <text x="600" y="1411" text-anchor="middle" class="box-title">最终真实性评分</text><text x="600" y="1438" text-anchor="middle" class="box-text">分数越高，视频越接近真实统计规律</text>
  <line x1="600" y1="1330" x2="600" y2="1380" stroke="#2869a8" stroke-width="2" marker-end="url(#arrow-blue)"/>
</svg>
