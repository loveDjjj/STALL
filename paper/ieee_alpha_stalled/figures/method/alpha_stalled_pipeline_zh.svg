<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <style>
    .title { font: 700 30px 'Noto Sans CJK SC','PingFang SC',sans-serif; fill: #18324b; }
    .section { font: 700 19px 'Noto Sans CJK SC','PingFang SC',sans-serif; fill: #174f87; }
    .box-title { font: 700 17px 'Noto Sans CJK SC','PingFang SC',sans-serif; fill: #18324b; }
    .box-text { font: 15px 'Noto Sans CJK SC','PingFang SC',sans-serif; fill: #425466; }
    .small { font: 13px 'Noto Sans CJK SC','PingFang SC',sans-serif; fill: #596b7a; }
    .white { font: 700 16px 'Noto Sans CJK SC','PingFang SC',sans-serif; fill: #ffffff; }
    .output { font: 700 20px 'Noto Sans CJK SC','PingFang SC',sans-serif; fill: #ffffff; }
  </style>
  <defs>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#2869a8"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#b64d5b"/></marker>
    <marker id="ac" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#258d9b"/></marker>
  </defs>
  <rect width="1200" height="1500" fill="#ffffff"/>
  <text x="65" y="62" class="title">Alpha-STALLED：Global STALL 与 Local D2-only 真实视频校准</text>
  <line x1="65" y1="86" x2="1135" y2="86" stroke="#d6dee7" stroke-width="2"/>

  <!-- Stage 1 -->
  <circle cx="70" cy="145" r="24" fill="#255f9d"/><text x="64" y="152" class="white">1</text>
  <text x="112" y="140" class="section">真实参考统计构建</text>
  <text x="112" y="164" class="small">Global 固定加载官方资产；Local 仅使用与评测集互斥的目标域真实视频</text>

  <rect x="85" y="205" width="285" height="120" rx="6" fill="#fff5f6" stroke="#b64d5b" stroke-width="2"/>
  <text x="228" y="244" text-anchor="middle" class="box-title">官方 STALL Global 参考</text>
  <text x="228" y="274" text-anchor="middle" class="box-text">VATEX Global Spatial / T1</text>
  <text x="228" y="300" text-anchor="middle" class="small">固定白化参数与窗口 CDF</text>

  <rect x="420" y="205" width="200" height="100" rx="6" fill="#f5f9ff" stroke="#2869a8" stroke-width="2"/>
  <text x="520" y="243" text-anchor="middle" class="box-title">目标域真实视频</text>
  <text x="520" y="272" text-anchor="middle" class="box-text">独立 real calibration</text>
  <rect x="665" y="205" width="190" height="100" rx="6" fill="#f5f9ff" stroke="#2869a8" stroke-width="2"/>
  <text x="760" y="242" text-anchor="middle" class="box-title">均匀窗口采样</text>
  <text x="760" y="270" text-anchor="middle" class="box-text">K≤3，2 秒，8 FPS</text>
  <rect x="900" y="205" width="220" height="100" rx="6" fill="#174f87" stroke="#174f87" stroke-width="2"/>
  <text x="1010" y="242" text-anchor="middle" class="white">冻结 DINOv3 ViT-L/16</text>
  <text x="1010" y="270" text-anchor="middle" class="white">提取 14×14 Patch Token</text>
  <line x1="620" y1="255" x2="665" y2="255" stroke="#2869a8" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="855" y1="255" x2="900" y2="255" stroke="#2869a8" stroke-width="2" marker-end="url(#ab)"/>

  <rect x="795" y="355" width="325" height="120" rx="6" fill="#effbfc" stroke="#258d9b" stroke-width="2"/>
  <text x="958" y="392" text-anchor="middle" class="box-title">Local D2 参考统计</text>
  <text x="958" y="421" text-anchor="middle" class="box-text">同网格二阶差分白化参数</text>
  <text x="958" y="448" text-anchor="middle" class="small">窗口 CDF + effective-K 视频 CDF</text>
  <line x1="1010" y1="305" x2="1010" y2="355" stroke="#258d9b" stroke-width="2" marker-end="url(#ac)"/>

  <rect x="420" y="365" width="300" height="100" rx="6" fill="#f7f8fa" stroke="#7d8a96" stroke-width="2"/>
  <text x="570" y="402" text-anchor="middle" class="box-title">分支视频级真实参考</text>
  <text x="570" y="431" text-anchor="middle" class="box-text">按 effective-K 分组的 Global / Local CDF</text>
  <line x1="520" y1="305" x2="520" y2="365" stroke="#2869a8" stroke-width="2" marker-end="url(#ab)"/>

  <rect x="285" y="500" width="620" height="82" rx="6" fill="#f7f8fa" stroke="#7d8a96" stroke-width="2"/>
  <text x="595" y="534" text-anchor="middle" class="box-title">冻结的真实视频参考库</text>
  <text x="595" y="560" text-anchor="middle" class="box-text">官方 Global 资产 + 目标域 Local D2 参数 + 视频级 CDF</text>
  <line x1="228" y1="325" x2="228" y2="541" stroke="#b64d5b" stroke-width="2"/><line x1="228" y1="541" x2="285" y2="541" stroke="#b64d5b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="570" y1="465" x2="570" y2="500" stroke="#2869a8" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="958" y1="475" x2="905" y2="525" stroke="#258d9b" stroke-width="2" marker-end="url(#ac)"/>

  <line x1="65" y1="620" x2="1135" y2="620" stroke="#d6dee7" stroke-width="2"/>

  <!-- Stage 2 -->
  <circle cx="70" cy="675" r="24" fill="#b64d5b"/><text x="64" y="682" class="white">2</text>
  <text x="112" y="670" class="section">待测视频证据提取与视频级校准</text>
  <text x="112" y="694" class="small">不读取真假标签、生成器来源或测试批次组成</text>

  <rect x="100" y="735" width="210" height="90" rx="6" fill="#fff5f6" stroke="#b64d5b" stroke-width="2"/>
  <text x="205" y="771" text-anchor="middle" class="box-title">待测视频</text>
  <text x="205" y="798" text-anchor="middle" class="box-text">单个未知视频</text>
  <rect x="390" y="735" width="210" height="90" rx="6" fill="#f5f9ff" stroke="#2869a8" stroke-width="2"/>
  <text x="495" y="771" text-anchor="middle" class="box-title">均匀窗口采样</text>
  <text x="495" y="798" text-anchor="middle" class="box-text">至多三个互异 2 秒窗口</text>
  <rect x="680" y="735" width="260" height="90" rx="6" fill="#174f87" stroke="#174f87" stroke-width="2"/>
  <text x="810" y="769" text-anchor="middle" class="white">冻结 DINOv3</text>
  <text x="810" y="797" text-anchor="middle" class="white">Global + Patch Token</text>
  <line x1="310" y1="780" x2="390" y2="780" stroke="#2869a8" stroke-width="2" marker-end="url(#ab)"/>
  <line x1="600" y1="780" x2="680" y2="780" stroke="#2869a8" stroke-width="2" marker-end="url(#ab)"/>

  <rect x="90" y="870" width="480" height="45" rx="5" fill="#b64d5b"/>
  <text x="330" y="899" text-anchor="middle" class="white">Global：STALL Spatial + T1</text>
  <rect x="630" y="870" width="480" height="45" rx="5" fill="#258d9b"/>
  <text x="870" y="899" text-anchor="middle" class="white">Local：同网格 D2-only</text>
  <line x1="810" y1="825" x2="330" y2="825" stroke="#b64d5b" stroke-width="2"/><line x1="330" y1="825" x2="330" y2="870" stroke="#b64d5b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="810" y1="825" x2="870" y2="825" stroke="#258d9b" stroke-width="2"/><line x1="870" y1="825" x2="870" y2="870" stroke="#258d9b" stroke-width="2" marker-end="url(#ac)"/>

  <rect x="90" y="950" width="215" height="125" rx="6" fill="#fff5f6" stroke="#b64d5b" stroke-width="2"/>
  <text x="198" y="986" text-anchor="middle" class="box-title">Global Spatial</text>
  <text x="198" y="1015" text-anchor="middle" class="box-text">逐帧似然，窗口内 max</text>
  <text x="198" y="1042" text-anchor="middle" class="small">官方 VATEX 窗口 CDF</text>
  <rect x="355" y="950" width="215" height="125" rx="6" fill="#fff5f6" stroke="#b64d5b" stroke-width="2"/>
  <text x="463" y="986" text-anchor="middle" class="box-title">Global T1</text>
  <text x="463" y="1015" text-anchor="middle" class="box-text">归一化一阶差分，min</text>
  <text x="463" y="1042" text-anchor="middle" class="small">官方 VATEX 窗口 CDF</text>
  <rect x="680" y="950" width="380" height="125" rx="6" fill="#effbfc" stroke="#258d9b" stroke-width="2"/>
  <text x="870" y="986" text-anchor="middle" class="box-title">Local D2</text>
  <text x="870" y="1015" text-anchor="middle" class="box-text">同位置 patch 二阶差分，时间/网格 mean</text>
  <text x="870" y="1042" text-anchor="middle" class="small">目标域 real 窗口 CDF</text>
  <line x1="330" y1="915" x2="198" y2="950" stroke="#b64d5b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="330" y1="915" x2="463" y2="950" stroke="#b64d5b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="870" y1="915" x2="870" y2="950" stroke="#258d9b" stroke-width="2" marker-end="url(#ac)"/>

  <rect x="155" y="1120" width="350" height="92" rx="6" fill="#f7f8fa" stroke="#7d8a96" stroke-width="2"/>
  <text x="330" y="1157" text-anchor="middle" class="box-title">Global 视频级校准</text>
  <text x="330" y="1185" text-anchor="middle" class="box-text">0.5/0.5 窗口融合 → 窗口均值 → effective-K CDF</text>
  <rect x="695" y="1120" width="350" height="92" rx="6" fill="#f7f8fa" stroke="#7d8a96" stroke-width="2"/>
  <text x="870" y="1157" text-anchor="middle" class="box-title">Local 视频级校准</text>
  <text x="870" y="1185" text-anchor="middle" class="box-text">D2 窗口均值 → effective-K CDF</text>
  <line x1="198" y1="1075" x2="330" y2="1120" stroke="#b64d5b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="463" y1="1075" x2="330" y2="1120" stroke="#b64d5b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="870" y1="1075" x2="870" y2="1120" stroke="#258d9b" stroke-width="2" marker-end="url(#ac)"/>

  <!-- Stage 3 -->
  <line x1="65" y1="1250" x2="1135" y2="1250" stroke="#d6dee7" stroke-width="2"/>
  <circle cx="70" cy="1310" r="24" fill="#258d9b"/><text x="64" y="1317" class="white">3</text>
  <text x="112" y="1305" class="section">固定融合</text>
  <rect x="335" y="1285" width="530" height="90" rx="6" fill="#174f87" stroke="#174f87" stroke-width="2"/>
  <text x="600" y="1321" text-anchor="middle" class="output">S(V) = 0.60 G(V) + 0.40 L(V)</text>
  <text x="600" y="1351" text-anchor="middle" class="white">分数越高，视频越符合真实参考统计</text>
  <line x1="330" y1="1212" x2="495" y2="1285" stroke="#b64d5b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="870" y1="1212" x2="705" y2="1285" stroke="#258d9b" stroke-width="2" marker-end="url(#ac)"/>
  <rect x="425" y="1410" width="350" height="58" rx="6" fill="#effbfc" stroke="#258d9b" stroke-width="2"/>
  <text x="600" y="1447" text-anchor="middle" class="box-title">Alpha-STALLED 视频级真实性评分</text>
  <line x1="600" y1="1375" x2="600" y2="1410" stroke="#2869a8" stroke-width="2" marker-end="url(#ab)"/>
</svg>
