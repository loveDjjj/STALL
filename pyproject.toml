[tool.ruff]
# 固定格式化版本，避免升级工具造成无关的大面积改写。
required-version = "==0.12.12"
target-version = "py310"
line-length = 100
extend-exclude = [
    ".local_tools/**",
    "cache/**",
    "data/**",
    "datasets/**",
    "dinov3/**",
    "precomputed/**",
    "results/**",
    "paper/ieee_alpha_stalled/build/**",
]

[tool.ruff.lint]
# 先约束语法错误、非法比较和未定义名称；保留有副作用的延迟导入。
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
